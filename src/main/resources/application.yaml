spring:
  application:
    name: spring-benchmark
  threads:
    virtual:
      enabled: true
server:
  port: 8080
  tomcat:
    accept-count: ${ACCEPT_COUNT:100}
    max-connections: ${MAX_CONNECTIONS:8192}

concurrency:
  target: ${TARGET_CONCURRENCY:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.popovrnd.springbenchmark: ${LOG_LEVEL_BENCHMARK:ERROR}