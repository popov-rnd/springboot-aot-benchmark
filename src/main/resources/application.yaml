spring:
  application:
    name: spring-aot-benchmark
  threads:
    virtual:
      enabled: ${VT_ENABLED:true}
server:
  port: 8080
  tomcat:
    threads:
      max: ${MAX_THREADS:200}

concurrency:
  max: ${MAX_CONCURRENCY:200}
  semaphore: ${USE_SEMAPHORE:false}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    com.popovrnd.springaotbenchmark: ${LOG_LEVEL_BENCHMARK:WARN}