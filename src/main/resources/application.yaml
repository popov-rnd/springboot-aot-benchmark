spring:
  application:
    name: spring-benchmark
  threads:
    virtual:
      enabled: true
server:
  port: 8080
  tomcat:
    accept-count: ${ACCEPT_COUNT:100}
    max-connections: ${MAX_CONNECTIONS:10000}

concurrency:
  target: ${TARGET_CONCURRENCY:1000}

http-client:
  connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:100ms}
  read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:500ms}

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.popovrnd.springbenchmark: ${LOG_LEVEL_BENCHMARK:ERROR}